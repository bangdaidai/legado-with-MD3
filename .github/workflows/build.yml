name: Build Signed Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEY_STORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "=========================================="
          echo "Step 1: 签名文件配置"
          echo "=========================================="
          STORE_PW=$(printf '%s' "$STORE_PW" | tr -d '[:space:]')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KEY_PW=$(printf '%s' "$KEY_PW" | tr -d '[:space:]')
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ RELEASE_KEY_STORE_BASE64 未设置，将使用 debug 签名"
            exit 0
          fi
          mkdir -p $GITHUB_WORKSPACE
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > $GITHUB_WORKSPACE/release.keystore
          echo "✅ Keystore 文件创建成功: $GITHUB_WORKSPACE/release.keystore"
          echo "📊 文件大小: $(stat -c%s $GITHUB_WORKSPACE/release.keystore) 字节"
          {
            echo ""
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_STORE_PASSWORD=$STORE_PW"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PW"
          } >> gradle.properties
          echo "📋 已写入 gradle.properties 的 RELEASE 配置:"
          grep "RELEASE_" gradle.properties
          echo ""
          echo "🔍 校验 keystore..."
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$STORE_PW" >/dev/null 2>&1; then
            echo "❌ 步骤A失败：keystore 无法用 RELEASE_STORE_PASSWORD 打开"; exit 1
          fi
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "❌ 步骤B失败：别名 '$KEY_ALIAS' 不存在"; exit 1
          fi
          echo "✅ 校验通过：别名 '$KEY_ALIAS' 存在且 store 密码正确"

      - name: Verify Gradle Signing Config
        run: |
          echo "=========================================="
          echo "Step 2: 验证 Gradle 签名配置"
          echo "=========================================="
          echo "📋 当前 gradle.properties 中的 RELEASE 配置:"
          grep "RELEASE_" gradle.properties || echo "   未找到 RELEASE 配置"
          echo ""
          STORE_FILE=$(grep "^RELEASE_STORE_FILE=" gradle.properties | cut -d= -f2)
          if [ -z "$STORE_FILE" ]; then
            echo "❌ RELEASE_STORE_FILE 未配置"
          elif [ ! -f "$STORE_FILE" ]; then
            echo "❌ 签名文件不存在: $STORE_FILE"; exit 1
          else
            echo "✅ RELEASE_STORE_FILE 指向的文件存在: $STORE_FILE"
            echo "📊 文件实际大小: $(stat -c%s "$STORE_FILE") 字节"
          fi

      # ---------- 原有：混淆版 release ----------
      - name: Build Release APK (obfuscated)
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease -PabiSplits=arm64-v8a -PuniversalApk=false --no-daemon -x lint 2>&1 | tee build.log

      # ---------- 新增：nor8 未经混淆版 ----------
      - name: Build Release APK (nor8, no obfuscation)
        run: |
          chmod +x gradlew
          # -PnoObfuscate=true 让 legado 跳过 R8 混淆（并关闭 shrink），其余签名/ABI 配置沿用
          ./gradlew assembleAppRelease -PabiSplits=arm64-v8a -PuniversalApk=false -PnoObfuscate=true --no-daemon -x lint 2>&1 | tee build_nor8.log

      - name: Check Build Log for Signing Info
        run: |
          echo "=========================================="
          echo "Step 3: 构建日志中的签名信息"
          echo "=========================================="
          grep -i "sign" build.log | head -20 || true
          echo "--- nor8 log ---"
          grep -i "sign\|obfuscate\|dontobfuscate\|minify" build_nor8.log | head -20 || true

      - name: Check APK output
        run: |
          echo "=========================================="
          echo "Step 4: APK 输出检查"
          echo "=========================================="
          find app/build/outputs -name "*.apk" -type f
          echo ""
          ls -la app/build/outputs/apk/app/*/ || echo "Release 目录不存在"

      - name: Rename APKs (mark nor8)
        run: |
          echo "=========================================="
          echo "Step 5: 重命名 APK，区分混淆版与 nor8 版"
          echo "=========================================="
          # 混淆版（不带 nor8 标记）
          OB=$(find app/build/outputs/apk/app/release -name "legado_app_*.apk" ! -name "*nor8*" -type f | head -1)
          # nor8 版（来自第二次构建，位于 nor8 目录下或同名但需改名）
          NR=$(find app/build/outputs/apk/app/nor8 -name "legado_app_*.apk" -type f | head -1)
          if [ -z "$NR" ]; then
            # 有些版本 nor8 仍输出到 release 目录，按时间兜底
            NR=$(find app/build/outputs/apk/app/release -name "legado_app_*.apk" -newer build.log -type f | head -1)
          fi
          mkdir -p artifacts
          [ -n "$OB" ] && cp "$OB" artifacts/legado_app_release_obfuscated.apk && echo "✅ 混淆版: $OB"
          if [ -n "$NR" ]; then
            cp "$NR" artifacts/legado_app_release_nor8.apk && echo "✅ nor8 版: $NR"
          else
            echo "⚠️ 未找到 nor8 APK，尝试直接复制最新产物"
            cp $(ls -t app/build/outputs/apk/app/release/*.apk | head -1) artifacts/legado_app_release_nor8.apk
          fi
          ls -la artifacts/

      - name: Verify APK Signatures
        run: |
          echo "=========================================="
          echo "Step 6: 验证 APK 签名"
          echo "=========================================="
          for f in artifacts/*.apk; do
            echo "📦 $f"
            keytool -printcert -jarfile "$f" 2>&1 | grep -E "SHA256|Owner" || true
            echo ""
          done

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado_release_apks
          path: artifacts/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Download Release APKs
        uses: actions/download-artifact@v4
        with:
          name: legado_release_apks
          path: artifacts
      - name: Flatten APK files
        run: |
          echo "Flattened APKs:"
          ls -la artifacts/
      - name: Get version info
        id: version
        run: |
          VERSION=$(grep -oP 'VERSION_MAJOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_MINOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_PATCH=\K[0-9]+' app/version.properties)
          SUFFIX=$(grep -oP 'VERSION_SUFFIX=\K[0-9]+' app/version.properties)
          [ "$SUFFIX" = "1" ] && VERSION="${VERSION}-beta"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Generate Release Notes
        run: |
          echo "## 🚀 Release v${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> RELEASE_NOTES.md
          echo "**Commit:** ${{ github.sha }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📦 Downloads" >> RELEASE_NOTES.md
          echo "- **legado_app_release_obfuscated.apk** — R8 混淆+压缩的正式版（体积小）" >> RELEASE_NOTES.md
          echo "- **legado_app_release_nor8.apk** — 未经混淆版，便于排查崩溃堆栈、反编译对照" >> RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
