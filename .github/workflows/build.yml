name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.appversion.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 生成更新日志需要完整历史与已有 tag，用于定位上一个发布点
          fetch-depth: 0


      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEY_STORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "=========================================="
          echo "Step 1: 签名文件配置"
          echo "=========================================="

          # 去除 secret 可能带入的首尾空白/换行，避免别名或密码不匹配（表现为 Failed to read key ... null）
          STORE_PW=$(printf '%s' "$STORE_PW" | tr -d '[:space:]')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KEY_PW=$(printf '%s' "$KEY_PW" | tr -d '[:space:]')

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ RELEASE_KEY_STORE_BASE64 未设置，将使用 debug 签名"
            exit 0
          fi

          mkdir -p $GITHUB_WORKSPACE
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > $GITHUB_WORKSPACE/release.keystore

          echo "✅ Keystore 文件创建成功: $GITHUB_WORKSPACE/release.keystore"
          echo "📊 文件大小: $(stat -c%s $GITHUB_WORKSPACE/release.keystore) 字节"

          {
            echo ""
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_STORE_PASSWORD=$STORE_PW"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PW"
          } >> gradle.properties

          echo "📋 已写入 gradle.properties 的 RELEASE 配置:"
          grep "RELEASE_" gradle.properties

          echo ""
          echo "🔍 校验 keystore..."
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$STORE_PW" >/dev/null 2>&1; then
            echo "❌ 步骤A失败：keystore 无法用 RELEASE_STORE_PASSWORD 打开"
            echo "   → 说明 RELEASE_STORE_PASSWORD 不对，或 RELEASE_KEY_STORE_BASE64 解码出的文件已损坏"
            exit 1
          fi
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "❌ 步骤B失败：别名 '$KEY_ALIAS'(长度=${#KEY_ALIAS}) 不存在于该 keystore"
            echo "   → 说明 RELEASE_KEY_STORE_BASE64 不是配套的 legado keystore（可能仍是旧 readdai 的那个）"
            echo "   请检查 GitHub 上该 Secret 的开头：最新的必须是 'MIIKlAIBAz...'，旧的 readdai 是 'MIIJxAIBAz...'"
            exit 1
          fi
          echo "✅ 校验通过：别名 '$KEY_ALIAS' 存在且 store 密码正确"

      - name: Verify Gradle Signing Config
        run: |
          echo "=========================================="
          echo "Step 2: 验证 Gradle 签名配置"
          echo "=========================================="
          
          echo "📋 当前 gradle.properties 中的 RELEASE 配置:"
          grep "RELEASE_" gradle.properties || echo "   未找到 RELEASE 配置"
          echo ""
          
          STORE_FILE=$(grep "^RELEASE_STORE_FILE=" gradle.properties | cut -d= -f2)
          if [ -z "$STORE_FILE" ]; then
            echo "❌ RELEASE_STORE_FILE 未配置"
          elif [ ! -f "$STORE_FILE" ]; then
            echo "❌ 签名文件不存在: $STORE_FILE"
            echo "   这是签名不一致的原因！"
          else
            echo "✅ RELEASE_STORE_FILE 指向的文件存在: $STORE_FILE"
            echo "📊 文件实际大小: $(stat -c%s "$STORE_FILE") 字节"
            
            STORE_PASSWORD=$(grep "^RELEASE_STORE_PASSWORD=" gradle.properties | cut -d= -f2)
            KEY_ALIAS=$(grep "^RELEASE_KEY_ALIAS=" gradle.properties | cut -d= -f2)
            KEY_PASSWORD=$(grep "^RELEASE_KEY_PASSWORD=" gradle.properties | cut -d= -f2)
            
            if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              echo "✅ 所有签名参数已配置 (STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            else
              echo "❌ 部分签名参数缺失"
            fi
          fi

      - name: Resolve version name
        id: appversion
        run: |
          BASE=$(grep -oP 'VERSION_MAJOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_MINOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_PATCH=\K[0-9]+' app/version.properties)
          SUFFIX=$(grep -oP 'VERSION_SUFFIX=\K[0-9]+' app/version.properties)
          if [ "$SUFFIX" = "1" ]; then
            BASE="${BASE}-beta"
          fi
          # 云端构建在现有版本号后追加 run_number 与 UTC 日期，保证每次构建版本唯一且可追溯
          NAME="${BASE}.${{ github.run_number }}-$(date -u '+%Y%m%d')"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "APP_VERSION_NAME=$NAME" >> $GITHUB_ENV
          echo "构建版本号: $NAME"

      - name: Generate Changelog
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}
        run: |
          # 上一个发布 tag：本次 tag 还没创建，所以 HEAD 能 describe 到的就是上一版
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            echo "对比区间: $RANGE"
          else
            RANGE=$(git rev-list --max-count=20 HEAD | tail -n 1)..HEAD
            echo "未找到历史 tag，回退到最近 20 个提交: $RANGE"
          fi

          # 复用：把某个提交区间按 conventional commit 前缀分组写入指定文件
          gen_changes() {
            local rng="$1" out="$2"
            : > "$out"
            local lines
            section() {
              local pattern="$1" title="$2"
              lines=$(git log --no-merges --pretty=format:'%s' "$rng" | grep -E "$pattern" || true)
              [ -z "$lines" ] && return 0
              {
                echo "### $title"
                printf '%s\n' "$lines" \
                  | sed -E 's/ *Co-authored-by:.*$//' \
                  | sed -E 's/^[a-zA-Z]+\(([^)]*)\)!?: */* \1: /; s/^[a-zA-Z]+!?: */* /'
                echo ""
              } >> "$out"
            }
            section '^feat(\(|!?:)' '✨ 新功能'
            section '^fix(\(|!?:)' '🐛 修复'
            section '^perf(\(|!?:)' '⚡ 性能'
            section '^(refactor|style)(\(|!?:)' '🧹 优化与重构'
            section '^(docs|chore|build|ci|test|merge)(\(|!?:)' '🔧 其它'
            if ! grep -q '^### ' "$out"; then
              {
                echo "### 📝 本次改动"
                git log --no-merges --pretty=format:'* %s' "$rng"
                echo ""
                echo ""
              } >> "$out"
            fi
          }

          gen_changes "$RANGE" CHANGES.md

          # 历史版本：遍历已有 tag，每个 tag 自动派生一段（不含当前未发布段）
          : > HISTORY.md
          mapfile -t TAGS < <(git tag --sort=version:refname)
          if [ "${#TAGS[@]}" -ge 2 ]; then
            # 取最近 9 个 tag 作为窗口（8 段历史 + 1 个锚点 prev），避免日志过长
            start=$(( ${#TAGS[@]} > 9 ? ${#TAGS[@]} - 9 : 0 ))
            window=("${TAGS[@]:$start}")
            # 从新到旧输出，使「历史版本」顶部为最近一次发版
            for ((i = ${#window[@]} - 1; i >= 1; i--)); do
              tag="${window[$i]}"
              prev="${window[$i-1]}"
              r="$prev..$tag"
              cnt=$(git rev-list --count "$r" 2>/dev/null || echo 0)
              [ "$cnt" = "0" ] && continue
              date=$(git log -1 --date=format:'%Y/%m/%d' --format='%cd' "$tag")
              {
                echo "### $tag（$date）"
                echo ""
              } >> HISTORY.md
              gen_changes "$r" HIST_TMP.md
              cat HIST_TMP.md >> HISTORY.md
              echo "" >> HISTORY.md
            done
          fi

          {
            echo "## 🚀 Release v$APP_VERSION_NAME"
            echo ""
            echo "**Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit:** ${{ github.sha }}"
            if [ -n "$PREV_TAG" ]; then
              echo "**Since:** $PREV_TAG"
            fi
            echo ""
          } > RELEASE_NOTES.md
          cat CHANGES.md >> RELEASE_NOTES.md
          {
            echo "### 📦 Downloads"
            echo "- **APK:** 直接安装到 Android 设备"
          } >> RELEASE_NOTES.md

          echo "===== RELEASE_NOTES.md ====="
          cat RELEASE_NOTES.md
          echo "===== HISTORY.md ====="
          cat HISTORY.md

      - name: Inject changelog into app assets
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}
        run: |
          LOG=app/src/main/assets/updateLog.md
          LATEST_MARKER='<!-- CI_LATEST_CHANGELOG -->'
          HIST_MARKER='<!-- CI_HISTORY -->'
          if ! grep -qF "$LATEST_MARKER" "$LOG"; then
            echo "❌ $LOG 缺少 $LATEST_MARKER 占位标记，跳过注入"
            exit 0
          fi

          # 本版更新：当前构建（上一 tag 到 HEAD）的改动
          {
            echo "## 本版更新 v$APP_VERSION_NAME"
            echo ""
            cat CHANGES.md
          } > SECTION.md

          awk -v marker="$LATEST_MARKER" '
            index($0, marker) { while ((getline line < "SECTION.md") > 0) print line; next }
            { print }
          ' "$LOG" > "$LOG.tmp"
          mv "$LOG.tmp" "$LOG"

          # 历史版本：从已有 tag 自动派生，注入到 CI_HISTORY 标记之后
          if grep -qF "$HIST_MARKER" "$LOG" && [ -s HISTORY.md ]; then
            awk -v marker="$HIST_MARKER" '
              index($0, marker) { while ((getline line < "HISTORY.md") > 0) print line; next }
              { print }
            ' "$LOG" > "$LOG.tmp"
            mv "$LOG.tmp" "$LOG"
          fi

          echo "===== updateLog.md 头部 ====="
          head -n 80 "$LOG"


      - name: Build Release APK
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease -PabiSplits=arm64-v8a -PuniversalApk=false --no-daemon -x lint 2>&1 | tee build.log


      - name: Check Build Log for Signing Info
        run: |
          echo "=========================================="
          echo "Step 3: 构建日志中的签名信息"
          echo "=========================================="
          
          echo "🔍 搜索签名相关日志:"
          grep -i "sign" build.log | head -20 || echo "   未找到签名相关日志"
          echo ""
          
          grep -i "release" build.log | grep -i "sign" | head -10 || true
          echo ""
          
          echo "⚠️ 检查是否有签名失败或回退信息:"
          grep -i "debug.*sign\|fallback\|signing.*fail\|signing.*error\|not found\|unable\|error" build.log | head -20 || echo "   未发现明显的签名错误"

      - name: Check APK output
        run: |
          echo "=========================================="
          echo "Step 4: APK 输出检查"
          echo "=========================================="
          
          find app/build/outputs -name "*.apk" -type f
          echo ""
          ls -la app/build/outputs/apk/app/*/ || echo "Release 目录不存在"

      - name: Rename APK Files
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}
        run: |
          APK_DIR=app/build/outputs/apk/app/release
          for f in "$APK_DIR"/*.apk; do
            abi=$(basename "$f" | sed -n 's/.*\(armeabi-v7a\|arm64-v8a\|universal\).*/-\1/p')
            mv -- "$f" "$APK_DIR/legado-${APP_VERSION_NAME}${abi}.apk"
          done
          ls -la "$APK_DIR"

      - name: Verify APK Signature
        run: |
          echo "=========================================="
          echo "Step 5: 验证 APK 签名指纹"
          echo "=========================================="
          
          APK_FILE=$(find app/build/outputs -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ 未找到 APK 文件"
            exit 1
          fi
          
          echo "📦 APK 文件: $APK_FILE"
          echo "📊 APK 大小: $(stat -c%s "$APK_FILE") 字节"
          echo ""
          
          echo "🔐 APK 签名信息:"
          unzip -p "$APK_FILE" META-INF/*.RSA 2>/dev/null | keytool -printcert -jarfile "$APK_FILE" 2>/dev/null || \
          jarsigner -verify -verbose -certs "$APK_FILE" 2>&1 | head -20
          echo ""
          
          echo "🔑 签名证书指纹 (SHA256):"
          keytool -printcert -jarfile "$APK_FILE" 2>&1 | grep -A1 "SHA256" || echo "   无法提取 SHA256 指纹"
          echo ""
          
          STORE_FILE=$(grep "^RELEASE_STORE_FILE=" gradle.properties | cut -d= -f2)
          if [ -n "$STORE_FILE" ] && [ -f "$STORE_FILE" ]; then
            STORE_PASSWORD=$(grep "^RELEASE_STORE_PASSWORD=" gradle.properties | cut -d= -f2)
            KEY_ALIAS=$(grep "^RELEASE_KEY_ALIAS=" gradle.properties | cut -d= -f2)
            
            echo "🔑 Keystore 证书指纹 (SHA256):"
            keytool -list -v -keystore "$STORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>&1 | grep "SHA256:" || echo "   无法提取 keystore SHA256 指纹"
          fi
          echo ""
          
          echo "✅ 如果 APK 的 SHA256 指纹与 Keystore 的 SHA256 指纹一致，说明签名成功！"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: legado_release_signed_apk
          path: app/build/outputs/apk/app/**/*.apk
          retention-days: 30

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 30

      - name: Upload Mapping (compressed)
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/appRelease/mapping.txt
          retention-days: 30
          compression-level: 9

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug -x lint --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-apk
          path: app/build/outputs/apk/app/debug/*.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: legado_release_signed_apk
          path: apk_nested

      - name: Download Mapping
        uses: actions/download-artifact@v4
        with:
          name: mapping
          path: mapping_dir

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .


      - name: Flatten APK files
        run: |
          mkdir -p artifacts
          find apk_nested -name "*.apk" -type f -exec cp {} artifacts/ \;
          # mapping.txt 体积很大（数百 MB），gzip 后再随 Release 分发
          MAPPING=$(find mapping_dir -name "mapping.txt" -type f | head -n 1)
          if [ -n "$MAPPING" ]; then
            gzip -c "$MAPPING" > artifacts/mapping.txt.gz
          fi
          echo "Flattened artifacts:"
          ls -la artifacts/

      - name: Get version info
        id: version
        run: |
          # 直接复用 build job 解析好的版本号，保证日期与 APK 内版本完全一致
          echo "version=${{ needs.build.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Show Release Notes
        run: |
          # RELEASE_NOTES.md 由 build job 生成并随 artifact 带过来，保证与 APK 内置日志一致
          echo "===== RELEASE_NOTES.md ====="
          cat RELEASE_NOTES.md

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.apk
            artifacts/mapping.txt.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
