name: Build Signed Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEY_STORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "=========================================="
          echo "Step 1: 签名文件配置"
          echo "=========================================="

          STORE_PW=$(printf '%s' "$STORE_PW" | tr -d '[:space:]')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KEY_PW=$(printf '%s' "$KEY_PW" | tr -d '[:space:]')

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ RELEASE_KEY_STORE_BASE64 未设置"
            exit 1
          fi

          mkdir -p $GITHUB_WORKSPACE
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > $GITHUB_WORKSPACE/release.keystore
          echo "✅ Keystore 文件创建成功: $GITHUB_WORKSPACE/release.keystore"
          echo "📊 文件大小: $(stat -c%s $GITHUB_WORKSPACE/release.keystore) 字节"

          # 直接导出环境变量，不修改gradle.properties！！
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=$STORE_PW" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=$KEY_PW" >> $GITHUB_ENV

          echo ""
          echo "🔍 校验 keystore..."
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$STORE_PW" >/dev/null 2>&1; then
            echo "❌ 步骤A失败：keystore无法打开，store密码错误或者keystore损坏"
            exit 1
          fi
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "❌ 步骤B失败：别名 '$KEY_ALIAS' 不存在"
            exit 1
          fi
          echo "✅ keystore校验全部通过"

      - name: Grant execute permission gradlew
        run: chmod +x gradlew

      - name: Build Release + Debug APK
        run: |
          ./gradlew clean assembleAppRelease assembleAppDebug \
            -PabiSplits=arm64-v8a \
            -PuniversalApk=false \
            --no-daemon \
            -x lint \
            --info 2>&1 | tee full_build.log

      - name: Check APK output
        run: |
          echo "=========================================="
          echo "Step 4: APK 输出检查"
          echo "=========================================="
          find app/build/outputs -name "*.apk" -type f
          echo ""
          RELEASE_APK=$(find app/build/outputs/apk/app/release -name "*.apk" -type f | head -1)
          DEBUG_APK=$(find app/build/outputs/apk/app/debug -name "*.apk" -type f | head -1)

          if [ -z "$RELEASE_APK" ]; then
            echo "❌ ERROR：没有生成Release APK！构建任务成功但是无产物，变体未激活！"
            exit 1
          fi
          if [ -z "$DEBUG_APK" ]; then
            echo "❌ ERROR：没有生成Debug APK！"
            exit 1
          fi
          echo "✅ APK文件全部生成"

      - name: Check Build Log for Signing Info
        run: |
          echo "=========================================="
          echo "Step 3: 构建日志中的签名信息"
          echo "=========================================="
          grep -i "sign\|variant" full_build.log | head -40

      - name: Verify APK Signature
        run: |
          echo "=========================================="
          echo "Step 5: 验证 APK 签名指纹"
          echo "=========================================="
          RELEASE_APK=$(find app/build/outputs/apk/app/release -name "*.apk" -type f | head -1)
          echo "📦 Release APK: $RELEASE_APK"
          keytool -printcert -jarfile "$RELEASE_APK" 2>&1 | grep -A2 "SHA256"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: legado_release_signed_apk
          path: app/build/outputs/apk/app/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: legado_debug_apk
          path: app/build/outputs/apk/app/debug/*.apk
          retention-days: 30

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: full_build.log
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: legado_release_signed_apk
          path: artifacts/release

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: legado_debug_apk
          path: artifacts/debug

      - name: Flatten APK files
        run: |
          mkdir -p artifacts/all
          find artifacts/release -name "*.apk" -type f -exec cp {} artifacts/all/ \;
          find artifacts/debug -name "*.apk" -type f -exec cp {} artifacts/all/ \;
          ls -la artifacts/all/

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep -oP 'VERSION_MAJOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_MINOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_PATCH=\K[0-9]+' app/version.properties)
          SUFFIX=$(grep -oP 'VERSION_SUFFIX=\K[0-9]+' app/version.properties)
          if [ "$SUFFIX" = "1" ]; then
            VERSION="${VERSION}-beta"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        run: |
          echo "## 🚀 Release v${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> RELEASE_NOTES.md
          echo "**Commit:** ${{ github.sha }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📦 Downloads" >> RELEASE_NOTES.md
          echo "- **Release APK:** 正式签名版本，直接安装到 Android 设备" >> RELEASE_NOTES.md
          echo "- **Debug APK:** 调试版本，用于测试" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: artifacts/all/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}