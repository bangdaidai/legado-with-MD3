name: Build APK for User

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'trae/solo-agent-vhkVM3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          submodules: recursive


      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      # 三引擎 -legado 定制版没有发布到任何 Maven 仓库，只能从 submodule 源码
      # 构建发布到本地仓库。产物按 submodule SHA 缓存：引擎没升级的提交直接
      # 命中缓存跳过约 5 分钟的源码构建。
      - name: Compute UI forks cache key
        id: uiforks_key
        run: |
          echo "key=ui-forks-$(git submodule status | awk '{print $1$2}' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # restore 与 save 拆开（cache/save 显式执行，job 失败也能落库；
      # cache@v4 的 save-always 输入已弃用且"does not work as intended"）
      - uses: actions/cache/restore@v4
        id: uiforks_restore
        with:
          path: build/ui-forks/maven
          key: ${{ steps.uiforks_key.outputs.key }}

      - name: Prepare pinned UI forks
        if: steps.uiforks_restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-ui-forks

      - uses: actions/cache/save@v4
        if: steps.uiforks_restore.outputs.cache-hit != 'true'
        with:
          path: build/ui-forks/maven
          key: ${{ steps.uiforks_key.outputs.key }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Resolve version name
        id: appversion
        run: |
          BASE=$(grep -oP 'VERSION_MAJOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_MINOR=\K[0-9]+' app/version.properties).$(grep -oP 'VERSION_PATCH=\K[0-9]+' app/version.properties)
          SUFFIX=$(grep -oP 'VERSION_SUFFIX=\K[0-9]+' app/version.properties)
          if [ "$SUFFIX" = "1" ]; then
            BASE="${BASE}-beta"
          fi
          # 与 build.yml 一致：版本号后追加 run_number 与 UTC 日期
          NAME="${BASE}.${{ github.run_number }}-$(date -u '+%Y%m%d')"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "构建版本号: $NAME"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppCoreDebug -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}

      - name: Check Build Output
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/app/core/debug"
          echo "检查 APK 输出目录: $APK_PATH"
          ls -la "$APK_PATH" || true
          APK_COUNT=$(find "$APK_PATH" -maxdepth 1 -name "*.apk" | wc -l | tr -d ' ')
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "预期生成 1 个 universal APK，实际生成 $APK_COUNT 个！"
            exit 1
          fi

      - name: Rename APK Files
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/app/core/debug"
          cd "$APK_PATH"
          mv -- *.apk "legado-debug-${APP_VERSION_NAME}-universal.apk"
          ls -la

      - name: Create ZIP Archive
        env:
          APP_VERSION_NAME: ${{ steps.appversion.outputs.name }}
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/app/core/debug"
          ZIP_NAME="legado-debug-apks-${APP_VERSION_NAME}.zip"
          cd "$APK_PATH"
          zip "$GITHUB_WORKSPACE/$ZIP_NAME" *.apk
          echo "ZIP 文件已创建: $ZIP_NAME"
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legado-apks-${{ steps.appversion.outputs.name }}
          path: app/build/outputs/apk/app/core/debug/*.apk

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-apks-zip-${{ steps.appversion.outputs.name }}
          path: legado-debug-apks-*.zip
