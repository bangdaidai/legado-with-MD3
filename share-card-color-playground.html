<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享卡片配色 Playground</title>
<style>
  /* ============ 控制栏（不吃卡片主题变量，颜色写死） ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Noto Sans SC", sans-serif;
    background: #2b2b30;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 100;
    background: #1e1e22; color: #e8e8ea;
    padding: 12px 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    border-bottom: 1px solid #33333a;
  }
  .toolbar h1 { font-size: 14px; font-weight: 600; margin-right: 8px; }
  .toolbar label { font-size: 12px; color: #b6b6bc; }
  .toolbar input[type=color] {
    width: 40px; height: 30px; border: none; border-radius: 6px;
    background: none; cursor: pointer; padding: 0;
  }
  .presets { display: flex; gap: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform .1s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; }
  .btn {
    font-size: 12px; padding: 6px 12px; border-radius: 8px;
    background: #33333a; color: #e8e8ea; border: 1px solid #44444c;
    cursor: pointer;
  }
  .btn.active { background: #4a6cf7; border-color: #4a6cf7; }
  .readout { font-size: 11px; color: #888; font-family: monospace; }
  .stage-scroll { padding: 24px 0; display: flex; justify-content: center; }
  /* ============ 卡片（= app 内置模板，body 改名 .card-stage，宽度锁 390） ============ */
  .card-stage {
    width: 390px; max-width: 390px;
    padding: 28px 18px;
    background:
      radial-gradient(ellipse at 10% 20%, var(--bp-surface, #ffe2ea) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 80%, var(--bp-accent-light, #fccfdf) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(var(--bp-accent-rgb, 251, 200, 216), 0.45) 0%, transparent 50%),
      linear-gradient(145deg,
        var(--bp-accent-light, #ffe4ec) 0%,
        var(--bp-bg, #fdd6e2) 55%,
        rgba(var(--bp-accent-rgb, 247, 194, 212), 0.55) 100%);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    position: relative; overflow: hidden;
    color: var(--bp-text, #4d2e3a);
  }
  .card-stage::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(var(--bp-accent-rgb, 255,205,219), 0.06) 0px, transparent 2px, transparent 8px),
      repeating-linear-gradient(-45deg, rgba(var(--bp-accent-rgb, 255,188,207), 0.05) 0px, transparent 2px, transparent 8px);
  }
  .float-element { position: absolute; pointer-events: none; z-index: 0; }
  .float-star {
    width: 36px; height: 36px;
    background: radial-gradient(circle at 35% 35%, #fff7d6, var(--bp-accent-light, #fce1a4));
    clip-path: polygon(50% 0%, 61% 38%, 99% 36%, 68% 60%, 79% 97%, 49% 73%, 19% 97%, 29% 59%, 1% 37%, 39% 39%);
    filter: drop-shadow(0 3px 10px var(--bp-accent-fade, rgba(252,198,138,0.25)));
  }
  .float-heart {
    width: 38px; height: 35px; background: var(--bp-accent, #faaab9);
    transform: rotate(-10deg); border-radius: 19px 19px 0 0; position: relative;
    filter: drop-shadow(0 3px 12px var(--bp-accent-fade, rgba(250,158,179,0.3)));
  }
  .float-heart::before, .float-heart::after {
    content: ''; position: absolute; width: 37px; height: 58px;
    background: var(--bp-accent, #faaab9); border-radius: 30px 30px 0 0; top: -9px;
  }
  .float-heart::before { left: -19px; transform: rotate(-42deg); }
  .float-heart::after { right: -19px; transform: rotate(42deg); }
  .float-diamond {
    width: 32px; height: 50px;
    background: linear-gradient(135deg, var(--bp-accent-light, #fcd1e0), var(--bp-accent, #fbc4d6));
    clip-path: polygon(48% 0%, 95% 46%, 49% 93%, 3% 47%);
    transform: scale(0.9) rotate(6deg);
    filter: drop-shadow(0 3px 10px var(--bp-accent-fade, rgba(233,152,178,0.2)));
  }
  .float-circle {
    width: 34px; height: 34px; border: 3px solid var(--bp-accent, #fbbfcb);
    border-radius: 70% 30% 65% 35% / 55% 58% 41% 43%;
    background: var(--bp-accent-fade, rgba(253,227,237,0.25));
  }
  .float-dot-group { display: flex; gap: 12px; }
  .float-dot { width: 12px; height: 12px; border-radius: 80% 20% 74% 23% / 32% 69% 30% 66%; background: var(--bp-accent, #fbaec0); }
  .float-dot:nth-child(2) { background: var(--bp-accent-light, #fbc4d2); width: 16px; height: 16px; }
  .float-dot:nth-child(3) { background: var(--bp-star, #fddaac); width: 10px; height: 10px; }
  .fe-1{top:2%;left:4%}.fe-2{top:5%;right:6%}.fe-3{bottom:3%;left:7%}.fe-4{bottom:8%;right:4%}
  .fe-5{top:58%;left:89%}.fe-6{top:81%;left:76%}.fe-7{top:74%;left:84%}.fe-8{top:90%;left:82%}
  .fe-9{top:93%;left:86%}.fe-10{top:45%;left:2%}.fe-11{top:32%;right:2%}
  .card-wrap { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; }
  .card-outer-glow {
    padding: 6px; border-radius: 52px 22px 52px 22px;
    background: linear-gradient(135deg,
      var(--bp-accent-light, #fcdae6), var(--bp-accent, #fbc1d2) 40%,
      var(--bp-accent, #f7b2c6) 70%, var(--bp-accent-light, #fcc8d8));
    box-shadow: 0 0 30px var(--bp-accent-fade, rgba(243,156,182,0.15)),
                0 0 60px var(--bp-accent-fade, rgba(239,146,174,0.08));
    position: relative;
  }
  .card {
    background: var(--bp-surface, #fff8fb);
    border-radius: 48px 18px 48px 18px;
    padding: 28px 24px 32px;
    box-shadow: inset 0 0 0 1px var(--bp-divider, rgba(255,228,231,0.6)),
                inset 0 0 30px var(--bp-accent-fade, rgba(255,221,229,0.15)),
                0 4px 20px var(--bp-accent-fade, rgba(201,129,153,0.08));
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: -20%; right: -15%;
    width: 220px; height: 280px; pointer-events: none;
    background: radial-gradient(circle at 30% 40%, var(--bp-accent-fade, rgba(254,211,221,0.12)), transparent 75%);
  }
  .card::after {
    content: ''; position: absolute; bottom: -18%; left: -12%;
    width: 180px; height: 240px; pointer-events: none;
    background: radial-gradient(circle at 50% 60%, var(--bp-accent-fade, rgba(249,193,210,0.10)), transparent 70%);
  }
  .inner-border-pattern {
    position: absolute; inset: 10px; border-radius: 40px 12px 40px 12px;
    border: 1.5px dashed var(--bp-divider, rgba(226,166,183,0.22)); pointer-events: none;
  }
  .inner-border-pattern::before, .inner-border-pattern::after {
    content: '✿ ✿ ✿'; position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--bp-divider, rgba(217,154,173,0.25));
    letter-spacing: 8px; background: var(--bp-surface, #fff8fb); padding: 0 10px;
  }
  .inner-border-pattern::before { top: -9px; }
  .inner-border-pattern::after { bottom: -9px; }
  .top-section { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 20px; position: relative; z-index: 1; }
  .cover-wrapper {
    flex-shrink: 0; width: 88px; height: 118px;
    border-radius: 18px 6px 18px 6px; overflow: hidden;
    background: var(--bp-accent-light, #fde0e8);
    box-shadow: 0 4px 16px var(--bp-accent-fade, rgba(194,131,157,0.15)),
                inset 0 0 0 1px var(--bp-accent-light, rgba(255,189,204,0.2));
    position: relative;
  }
  .cover-wrapper .placeholder-icon {
    display: flex; align-items: center; justify-content: center; height: 100%;
    font-size: 38px; color: var(--bp-accent, #f5bacb); background: var(--bp-accent-light, #fce8ef);
  }
  .book-meta { flex: 1; min-width: 0; padding-top: 4px; }
  .book-name {
    font-size: 24px; font-weight: 720; color: var(--bp-text, #4d2e3a);
    letter-spacing: 0.06em; line-height: 1.25; word-break: break-word; margin-bottom: 3px;
  }
  .book-author { font-size: 13px; color: var(--bp-text-muted, #a37183); margin-bottom: 8px; letter-spacing: 0.04em; }
  .book-author::before { content: '✎ '; font-size: 15px; color: var(--bp-accent, #d992a7); }
  .status-tag {
    display: inline-block; font-size: 12px; font-weight: 550;
    padding: 4px 16px; border-radius: 56px;
    background: var(--bp-accent-light, #fad4dd); color: var(--bp-text, #723948);
    box-shadow: inset 0 1px 4px var(--bp-accent-fade, rgba(247,184,202,0.2));
    letter-spacing: 0.06em; margin-top: 2px;
    border: 1px solid var(--bp-accent, rgba(245,177,196,0.3));
  }
  .status-tag.在读 { background: #dbedd5; color: #41663b; }
  .status-tag.已读 { background: #d3e2fa; color: #33507a; }
  .status-tag.弃文 { background: #fbd3cf; color: #824743; }
  .status-tag.未读 { background: #ece3e6; color: #796468; }
  .bp-dark .status-tag.在读 { background: #2c4227; color: #b6d9ac; }
  .bp-dark .status-tag.已读 { background: #24344f; color: #a8c4ec; }
  .bp-dark .status-tag.弃文 { background: #4a2b28; color: #e8b0aa; }
  .bp-dark .status-tag.未读 { background: #3a3134; color: #c4b3b8; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 20px; position: relative; z-index: 1; }
  .divider-line {
    flex: 1; height: 2px; border-radius: 4px;
    background: linear-gradient(90deg, transparent, var(--bp-accent, #fbcbd8) 15%, var(--bp-accent, #fbcbd8) 85%, transparent);
  }
  .divider-icon { font-size: 20px; color: var(--bp-accent, #eaa8bb); letter-spacing: 8px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 16px; position: relative; z-index: 1; }
  .info-item {
    background: var(--bp-surface-variant, rgba(255,238,243,0.45));
    border-radius: 18px 6px 18px 6px; padding: 12px 14px 12px 16px;
    border: 1px solid var(--bp-divider, rgba(246,196,209,0.30));
    position: relative; overflow: hidden;
  }
  .info-item .label {
    font-size: 11px; color: var(--bp-text-muted, #af7f8e);
    letter-spacing: 0.06em; margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .info-item .value { font-size: 16px; font-weight: 630; color: var(--bp-text, #482c36); letter-spacing: 0.02em; word-break: break-word; }
  .info-item .value-small { font-size: 14px; font-weight: 540; }
  .info-item.full { grid-column: span 2; }
  .progress-area { margin: 8px 0 18px; position: relative; z-index: 1; }
  .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--bp-text-muted, #967080); margin-bottom: 6px; }
  .progress-track {
    width: 100%; height: 12px; background: var(--bp-surface-variant, #f1d7e0);
    border-radius: 64px; overflow: hidden;
    box-shadow: inset 0 2px 4px var(--bp-accent-fade, rgba(171,119,137,0.08));
    border: 1px solid var(--bp-divider, rgba(238,188,202,0.2));
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--bp-accent-light, #f8b2c6), var(--bp-accent, #f590ab), var(--bp-accent, #f47ca0));
    border-radius: 64px; box-shadow: 0 0 10px var(--bp-accent-fade, rgba(241,133,170,0.15));
  }
  .rating-block { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 14px 0 10px; position: relative; z-index: 1; }
  .rating-stars { font-size: 28px; letter-spacing: 4px; line-height: 1; color: var(--bp-star, #faaa7a); filter: drop-shadow(0 2px 8px var(--bp-accent-fade, rgba(244,164,116,0.15))); }
  .rating-number {
    font-size: 18px; font-weight: 320; color: var(--bp-text-muted, #8a6270);
    background: var(--bp-surface-variant, rgba(237,203,214,0.25));
    padding: 3px 14px 3px 12px; border-radius: 54px;
    border: 1px solid var(--bp-divider, #eac6d1); letter-spacing: 0.04em;
  }
  .quote-area {
    margin-top: 16px; padding: 18px 18px 14px;
    background: var(--bp-surface-variant, rgba(239,212,222,0.14));
    border-radius: 32px 8px 32px 8px;
    border: 1.5px dashed var(--bp-divider, #edc3cf); position: relative; z-index: 1;
  }
  .quote-area::before { content: '❝'; font-size: 32px; color: var(--bp-accent, #f1baca); position: absolute; top: -6px; left: 10px; opacity: 0.5; line-height: 1; }
  .quote-area::after { content: '❞'; font-size: 32px; color: var(--bp-accent, #f1baca); position: absolute; bottom: -6px; right: 10px; opacity: 0.3; line-height: 1; }
  .quote-text { font-size: 13px; color: var(--bp-text, #5f424d); line-height: 1.7; padding-left: 10px; font-style: italic; letter-spacing: 0.025em; word-break: break-word; }
  .quote-chapter { font-size: 11px; color: var(--bp-text-muted, #ad7d8c); text-align: right; margin-top: 8px; padding-right: 6px; }
  .quote-chapter::before { content: '📖 '; font-size: 12px; }
  .footer-note {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 22px; font-size: 11px; color: var(--bp-text-muted, #b68896);
    position: relative; z-index: 1; padding: 0 4px;
  }
  .footer-note .left { display: flex; align-items: center; gap: 10px; }
  .footer-note .badge {
    background: var(--bp-accent-light, #fbdee8); padding: 3px 14px; border-radius: 51px;
    color: var(--bp-text, #764f5e); font-weight: 480; font-size: 10px; letter-spacing: 0.05em;
    box-shadow: inset 0 0 0 1px var(--bp-accent-light, #f6cad6);
  }
  .footer-note .date {
    background: var(--bp-surface-variant, rgba(234,204,214,0.15));
    padding: 3px 14px; border-radius: 57px;
    border: 1px solid var(--bp-divider, rgba(214,175,189,0.2));
  }
</style>

<body>
<style id="accentVars"></style>

<div class="toolbar">
  <h1>分享卡片配色 Playground</h1>
  <label>主色</label>
  <input type="color" id="picker" value="#f4a9b6">
  <div class="presets" id="presets"></div>
  <button class="btn" id="btnDefault">默认（无主色）</button>
  <label>方案</label>
  <button class="btn active" data-scheme="auto">自动</button>
  <button class="btn" data-scheme="light">强制亮</button>

</div>

<div class="stage-scroll">
  <div class="card-stage" id="stage">
    <div class="float-element fe-1"><div class="float-star"></div></div>
    <div class="float-element fe-2"><div class="float-heart"></div></div>

    <div class="float-element fe-4"><div class="float-circle"></div></div>

    <div class="float-element fe-6"><div class="float-star" style="width:24px;height:24px;opacity:0.5;"></div></div>
    <div class="float-element fe-7"><div class="float-heart" style="width:26px;height:24px;transform:rotate(18deg);opacity:0.4;"></div></div>
    <div class="float-element fe-8"><div class="float-diamond" style="width:22px;height:36px;opacity:0.4;"></div></div>

    <div class="float-element fe-10"><div class="float-heart" style="width:20px;height:18px;transform:rotate(40deg);opacity:0.3;"></div></div>
    <div class="float-element fe-11"><div class="float-star" style="width:18px;height:18px;opacity:0.35;"></div></div>
    <div class="card-wrap">
      <div class="card-outer-glow">
        <div class="card">
          <div class="inner-border-pattern"></div>
          <div class="top-section">
            <div class="cover-wrapper"><div class="placeholder-icon">🌸</div></div>
            <div class="book-meta">
              <div class="book-name">示例书名</div>

          </div>
          <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-icon">♡ ✿ ♡</span>

          </div>
          <div class="info-grid">
            <div class="info-item"><div class="label">🌟 进度</div><div class="value">42%</div></div>
            <div class="info-item"><div class="label">🍡 已读</div><div class="value value-small">88 章</div></div>
            <div class="info-item"><div class="label">⏳ 时长</div><div class="value value-small">12小时30分</div></div>
            <div class="info-item"><div class="label">💬 书摘</div><div class="value value-small">23 条</div></div>
            <div class="info-item full"><div class="label">🏷️ 标签</div><div class="value value-small">悬疑 / 推理 / 长篇</div></div>
          </div>
          <div class="progress-area">
            <div class="progress-header">
              <span>🌟 阅读进度</span>
              <span>88 / 210 章</span>

<script>
/* =========================================================================
 * 这一段是 ShareCardHtmlRenderer.kt 的 JS 复刻，数值必须和 Kotlin 一字不差。
 * 改了 Kotlin 就要同步改这里，否则 playground 会骗你。
 * ========================================================================= */

/** androidx.core.graphics.ColorUtils.RGBToHSL 的等价实现。h∈[0,360) s,l∈[0,1] */
function rgbToHsl(r, g, b) {
  const rf = r / 255, gf = g / 255, bf = b / 255;
  const max = Math.max(rf, gf, bf), min = Math.min(rf, gf, bf);
  const delta = max - min;
  const l = (max + min) / 2;
  let h, s;
  if (max === min) {
    h = 0; s = 0;
  } else {
    if (max === rf)      h = ((gf - bf) / delta) % 6;
    else if (max === gf) h = ((bf - rf) / delta) + 2;
    else                 h = ((rf - gf) / delta) + 4;
    s = delta / (1 - Math.abs(2 * l - 1));
  }
  h = (h * 60) % 360;
  if (h < 0) h += 360;
  return [h, s, l];
}

/** androidx.core.graphics.ColorUtils.HSLToColor 的等价实现，返回 [r,g,b] 整数 */
function hslToRgb(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const m = l - 0.5 * c;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const seg = Math.floor(h / 60);
  let r, g, b;
  switch (seg) {
    case 0:  r = c + m; g = x + m; b = m;     break;
    case 1:  r = x + m; g = c + m; b = m;     break;
    case 2:  r = m;     g = c + m; b = x + m; break;
    case 3:  r = m;     g = x + m; b = c + m; break;
    case 4:  r = x + m; g = m;     b = c + m; break;
    default: r = c + m; g = m;     b = x + m; break;
  }
  const cl = v => Math.min(255, Math.max(0, Math.round(v * 255)));
  return [cl(r), cl(g), cl(b)];
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
/** 对应 Kotlin 的 hslColor()：坐标同样先 coerce 再转 */
function hsl(h, s, l) { return hslToRgb(clamp(h, 0, 360), clamp(s, 0, 1), clamp(l, 0, 1)); }
const cssRgb = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
const triple = c => c[0] + ',' + c[1] + ',' + c[2];
function cssHsla(h, s, l, a) { const c = hsl(h, s, l); return 'rgba(' + triple(c) + ',' + clamp(a, 0, 1) + ')'; }
/** hex #rrggbb → [r,g,b] */
function hexToRgb(hex) {
  const m = hex.replace('#', '');
  return [parseInt(m.slice(0, 2), 16), parseInt(m.slice(2, 4), 16), parseInt(m.slice(4, 6), 16)];
}

/** 对应 Kotlin 的 isDarkByDefault：主色明度 <0.55 判定为暗。
 *  注意 Kotlin 那边用的是 (max+min)/2/255 的近似 HSL L，而不是 rgbToHsl 里的 L；
 *  这里也照抄，避免边界值判定不一致。 */
function isDarkByDefault([r, g, b]) {
  const l = (Math.max(r, g, b) + Math.min(r, g, b)) / 2 / 255;
  return l < 0.55;
}

/** 对应 buildAccentStyle。forceDark: null/true/false */
function buildAccentStyle(rgb, forceDark) {
  const [h, s, lRaw] = rgbToHsl(rgb[0], rgb[1], rgb[2]);
  const l = lRaw;
  const isDark = forceDark == null ? (l < 0.55) : forceDark;

  let accentColor, accentLight, star, onAccent, bg, surface, surfaceVariant;
  let text, textMuted, textSubtle, divider;

  if (!isDark) {
    const accentL = clamp(l, 0.45, 0.72);
    accentColor = hsl(h, s * 0.95, accentL);
    accentLight = hsl(h, s * 0.35, 0.92);
    star        = hsl(h, s * 0.50, 0.55);
    bg          = hsl(h, s * 0.75, 0.85);
    surface     = hsl(h, s * 0.55, 0.955);
    surfaceVariant = hsl(h, s * 0.65, 0.91);
    text        = hsl(h, s * 0.30, 0.22);
    textMuted   = hsl(h, s * 0.25, 0.42);
    textSubtle  = hsl(h, s * 0.20, 0.58);
    divider     = cssHsla(h, s * 0.30, 0.45, 0.40);
    onAccent    = accentL > 0.60 ? hsl(h, s * 0.30, 0.15) : hsl(h, s * 0.10, 0.96);
  } else {
    const darkAccentL = clamp(l + 0.18, 0.55, 0.88);
    accentColor = hsl(h, s * 0.90, darkAccentL);
    accentLight = hsl(h, s * 0.45, 0.20);
    star        = hsl(h, s * 0.60, clamp(l + 0.20, 0.58, 0.88));
    bg          = hsl(h, s * 0.50, 0.11);
    surface     = hsl(h, s * 0.45, 0.17);
    surfaceVariant = hsl(h, s * 0.55, 0.23);
    text        = hsl(h, s * 0.25, 0.92);
    textMuted   = hsl(h, s * 0.22, 0.68);
    textSubtle  = hsl(h, s * 0.20, 0.52);
    divider     = cssHsla(h, s * 0.50, 0.75, 0.14);
    onAccent    = darkAccentL > 0.60 ? hsl(h, s * 0.30, 0.15) : hsl(h, s * 0.10, 0.96);
  }
  const vars = ':root{' +
    '--bp-accent:' + cssRgb(accentColor) + ';' +
    '--bp-accent-light:' + cssRgb(accentLight) + ';' +
    '--bp-accent-rgb:' + triple(accentColor) + ';' +
    '--bp-accent-fade:rgba(' + triple(accentColor) + ',0.15);' +
    '--bp-star:' + cssRgb(star) + ';' +
    '--bp-on-accent:' + cssRgb(onAccent) + ';' +
    '--bp-bg:' + cssRgb(bg) + ';' +
    '--bp-surface:' + cssRgb(surface) + ';' +
    '--bp-surface-rgb:' + triple(surface) + ';' +
    '--bp-surface-variant:' + cssRgb(surfaceVariant) + ';' +
    '--bp-text:' + cssRgb(text) + ';' +
    '--bp-text-muted:' + cssRgb(textMuted) + ';' +
    '--bp-text-subtle:' + cssRgb(textSubtle) + ';' +
    '--bp-text-rgb:' + triple(text) + ';' +
    '--bp-divider:' + divider + ';}';
  return { vars, isDark };
}

/* ============ 交互逻辑 ============ */
const presets = [
  ['薄荷绿', '#6bcbb1'], ['樱花粉', '#f4a9b6'], ['海蓝色', '#5ba3d9'],
  ['奶油黄', '#e6c97a'], ['雾霭紫', '#9b8bc0'], ['石墨灰', '#6b737d'],
];
const presetsEl = document.getElementById('presets');
presets.forEach(([name, hex]) => {
  const el = document.createElement('div');
  el.className = 'swatch';
  el.style.background = hex;
  el.title = name;
  el.dataset.hex = hex;
  presetsEl.appendChild(el);
});

const picker = document.getElementById('picker');
const stage = document.getElementById('stage');
const styleEl = document.getElementById('accentVars');
const readoutEl = document.getElementById('readout');
let forceDark = null; // null=auto, true, false
let currentHex = '#f4a9b6';

function applyColor() {
  const rgb = hexToRgb(currentHex);
  const { vars, isDark } = buildAccentStyle(rgb, forceDark);
  styleEl.textContent = vars;
  stage.classList.toggle('bp-dark', isDark);
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.hex === currentHex));
  readoutEl.textContent = currentHex + (isDark ? '  (暗)' : '  (亮)');
}

function clearColor() {
  styleEl.textContent = '';
  stage.classList.remove('bp-dark');
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  readoutEl.textContent = '默认（无主色）';
  currentHex = '';
}

picker.addEventListener('input', e => { currentHex = e.target.value; applyColor(); });
presetsEl.addEventListener('click', e => {
  const hex = e.target.dataset?.hex;
  if (hex) { currentHex = hex; picker.value = hex; applyColor(); }
});
document.getElementById('btnDefault').addEventListener('click', clearColor);
document.querySelectorAll('[data-scheme]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-scheme]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const v = btn.dataset.scheme;
    forceDark = v === 'auto' ? null : v === 'dark';
    if (currentHex) applyColor();
  });
});

// init
applyColor();
</script>
</body>
</html>
